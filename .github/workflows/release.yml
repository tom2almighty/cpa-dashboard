name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # 构建纯前端单文件面板: CPA 配置 panel-github-repository 后会自动拉取最新 Release 里名为 management.html 的资产
      - run: bun run build
      - name: 生成 SHA256 校验和
        run: |
          cd dist
          sha256sum management.html > management.html.sha256
          HASH=$(sha256sum management.html | awk '{print $1}')
          echo "PANEL_HASH=${HASH}" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/management.html
            dist/management.html.sha256
          body: |
            ### SHA256 校验和
            - `management.html`: `sha256:${{ env.PANEL_HASH }}`
