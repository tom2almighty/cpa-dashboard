name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "refer/**"
      - ".github/**"
      - ".gitignore"
      - "LICENSE"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build
