name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "refer/**"
      - ".github/**"
      - ".gitignore"
      - ".dockerignore"
      - ".env.example"
      - "docker-compose.yml"
      - "Dockerfile"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "refer/**"
      - ".github/**"
      - ".gitignore"
      - ".dockerignore"
      - ".env.example"
      - "docker-compose.yml"
      - "Dockerfile"
      - "LICENSE"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build && bun run build:server
      - run: bun run build:lite
