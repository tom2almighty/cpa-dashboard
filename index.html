<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M8 22V16M13.3 22V11M18.7 22V14M24 22V9' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPA Dashboard</title>
    <script>
      // 在应用脚本执行前应用主题,避免暗色模式先闪白
      (() => {
        try {
          const theme = localStorage.getItem("theme") || "system";
          const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- 单文件面板体积较大,应用挂载前先显示一个静态加载态 -->
      <div class="grid min-h-svh place-items-center">
        <div
          class="size-5 animate-spin rounded-full border-2 border-muted border-t-primary"
          role="status"
          aria-label="Loading"
        ></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
